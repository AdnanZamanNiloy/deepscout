name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff>=0.6"

      - name: Lint
        run: ruff check app tests bench

      - name: Run test suite
        env:
          # Fail-fast settings validation needs at least one LLM key set.
          GROQ_API_KEY: test-key-ci
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Root install runs the postinstall that installs the frontend deps, the
      # same way Cloudflare's build does.
      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm --prefix frontend test

      # The artifact Cloudflare deploys: VITE_DEMO=1 build plus the control
      # files. Catches the class of failure the deploy check reports
      # opaquely (the build was never exercised by this workflow before).
      - name: Build the demo bundle
        run: bash deploy/cloudflare-pages/build.sh

      - name: Validate the deploy config with wrangler
        run: npx --yes wrangler@4 deploy --dry-run
