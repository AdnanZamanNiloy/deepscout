<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Pipeline Trace — preview</title>
    <style>
      body { margin: 0; background: #0d0d0d; color: #e9e9ec;
             font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 80px; }
      .q { display: inline-block; margin: 0 0 22px auto; padding: 7px 13px;
           background: #222226; border-radius: 12px; font-size: 13px; }
      h1 { font-size: 15px; font-weight: 600; color: #8b8b94; margin: 0 0 18px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="q">What might be the trends and opportunities in 2026?</div>
      <h1>Mock replay — real wire-event shapes, invented content</h1>
      <div id="root"></div>
    </div>
    <script type="module">
      import { createRoot } from "react-dom/client";
      import { useEffect, useState } from "react";
      import AgentPipelineTrace from "/src/trace/AgentPipelineTrace.tsx";
      import { startMockReplay } from "/src/trace/mock.ts";
      import "/src/trace/trace.css";

      function Preview() {
        const [events, setEvents] = useState([]);
        const [done, setDone] = useState(false);
        useEffect(() => startMockReplay(
          (f) => setEvents((p) => [...p, f]), () => setDone(true)), []);
        return (
          <AgentPipelineTrace
            events={events}
            status={done ? "done" : "running"}
            defaultOpen
          />
        );
      }
      createRoot(document.getElementById("root")).render(<Preview />);
    </script>
  </body>
</html>
